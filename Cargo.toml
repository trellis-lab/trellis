[workspace]
resolver = "2"
members = [
    "crates/trellis-parser",
    "crates/trellis-core",
    "crates/trellis-wasm",
    "crates/trellis-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Trellis Contributors"]
license = "Commercial license"
repository = "https://github.com/trellis/trellis"

[workspace.dependencies]
# Parser dependencies
nom = "7.1"

# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI dependencies
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

# WASM dependencies
wasm-bindgen = "0.2"

# Rendering dependencies
resvg = "0.42"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
