<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trellis — Overlap-Free Mermaid Diagrams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
:root {
  --font-d: 'Courier Prime', monospace;
  --font-b: 'Inter', sans-serif;
  --font-m: 'JetBrains Mono', monospace;
  --ok: #3fb950; --warn: #d29922; --err: #f85149;

  /* ── DARK MODE (default) ── */
  --pg:   #003153;
  --sf:   #1B3F6E;
  --sf2:  rgba(27,63,110,0.55);
  --sf3:  rgba(27,63,110,0.30);
  --sf4:  rgba(27,63,110,0.20);
  --cb:   #071523;
  --pb:   #0d1e30;
  --ft:   #00203d;
  --ac:   #4A8AB5;
  --ac10: rgba(74,138,181,0.10);
  --ac12: rgba(74,138,181,0.12);
  --ac18: rgba(74,138,181,0.18);
  --ac20: rgba(74,138,181,0.20);
  --ac25: rgba(74,138,181,0.25);
  --ac30: rgba(74,138,181,0.30);
  --ac35: rgba(74,138,181,0.35);
  --tp:   #E8F4FB;
  --ts:   rgba(232,244,251,0.65);
  --tm:   rgba(232,244,251,0.50);
  --tf:   rgba(232,244,251,0.40);
  --tff:  rgba(232,244,251,0.25);
  --hs:   rgba(0,49,83,0.97);
  --grid: linear-gradient(rgba(74,138,181,0.18) 1px, transparent 1px),
          linear-gradient(90deg, rgba(74,138,181,0.18) 1px, transparent 1px);
  --logo-filter: invert(1) brightness(2);
  --scrollbar-track: rgba(0,49,83,0.3);
  --scrollbar-thumb: rgba(74,138,181,0.4);
  --code-text: #7dd3fc;
  --install-card-bg: rgba(27,63,110,0.55);
  --install-card-hover: var(--ac18);
}

html[data-theme="light"] {
  --pg:   #eef5fb;
  --sf:   #d4e7f5;
  --sf2:  rgba(31,95,150,0.12);
  --sf3:  rgba(31,95,150,0.07);
  --sf4:  rgba(31,95,150,0.10);
  --cb:   #f4f8fc;
  --pb:   #e8f2fa;
  --ft:   #c5ddef;
  --ac:   #1f5f96;
  --ac10: rgba(31,95,150,0.10);
  --ac12: rgba(31,95,150,0.12);
  --ac18: rgba(31,95,150,0.18);
  --ac20: rgba(31,95,150,0.20);
  --ac25: rgba(31,95,150,0.25);
  --ac30: rgba(31,95,150,0.30);
  --ac35: rgba(31,95,150,0.35);
  --tp:   #001d35;
  --ts:   rgba(0,29,53,0.70);
  --tm:   rgba(0,29,53,0.55);
  --tf:   rgba(0,29,53,0.45);
  --tff:  rgba(0,29,53,0.30);
  --hs:   rgba(238,245,251,0.97);
  --grid: linear-gradient(rgba(31,95,150,0.10) 1px, transparent 1px),
          linear-gradient(90deg, rgba(31,95,150,0.10) 1px, transparent 1px);
  --logo-filter: none;
  --scrollbar-track: rgba(74,138,181,0.1);
  --scrollbar-thumb: rgba(31,95,150,0.3);
  --code-text: #1a4f7a;
  --install-card-bg: var(--sf2);
  --install-card-hover: var(--ac18);
}

body {
  background: var(--pg);
  color: var(--tp);
  font-family: var(--font-b);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 200ms ease, color 200ms ease;
}
#root { display: flex; flex-direction: column; min-height: 100vh; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--scrollbar-track); }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

</style>

<body>
<script>
(function(){
  var saved = localStorage.getItem('trellis-theme-mode');
  var dark = saved !== null ? saved === 'dark' : true;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>

<!-- Load trellis-wasm; store a Promise so React can .then() it even after it resolves -->
<script type="module">
  import init, { render, render_with_metrics } from './wasm/trellis_wasm.js';
  window.__trellisReady = init()
    .then(() => { window.__trellis = { render, render_with_metrics }; })
    .catch(e => { window.__trellis_error = String(e); });
</script>

<div id="root"></div>



<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── CONSTANTS ───────────────────────────────────────────────────────────────

// Trellis theme names — serde serializes with rename_all = "lowercase"
// Dark default: ClassicBlueprint; Light default: Default
const TRELLIS_THEMES = [
  { value: 'default',          label: 'Default' },
  { value: 'paper',            label: 'Paper' },
  { value: 'blueprint',        label: 'Blueprint' },
  { value: 'dark',             label: 'Dark' },
  { value: 'midnight',         label: 'Midnight' },
  { value: 'forest',           label: 'Forest' },
  { value: 'classicblueprint', label: 'Classic Blueprint' },
];

const SAMPLE_DIAGRAMS = {
  c4: `C4Context
  title System Context — Payment Platform
  Person(customer, "Customer", "Places orders")
  Person(support, "Support Agent", "Handles issues")
  System(platform, "Payment Platform", "Processes payments")
  System_Ext(bank, "Banking API", "Clears transactions")
  System_Ext(notify, "Notifications", "Email & SMS alerts")
  Rel(customer, platform, "Submits payment")
  Rel(support, platform, "Manages disputes")
  Rel(platform, bank, "Clears funds")
  Rel(platform, notify, "Sends confirmation")`,

  flowchart: `flowchart LR
  Client([Client App])
  API[API Gateway]
  Auth[Auth Service]
  DB[(Database)]
  Cache[(Redis Cache)]
  Queue[[Job Queue]]
  Worker[Worker Service]
  Storage[/Object Storage/]

  Client --> API
  API --> Auth
  Auth --> DB
  API --> Cache
  API --> Queue
  Queue --> Worker
  Worker --> DB
  Worker --> Storage`,

  classDiagram: `classDiagram
  class DiagramRenderer {
    +String input
    +TrellisConfig config
    +render() SVG
    +renderWithMetrics() JSON
  }
  class TrellisConfig {
    +String direction
    +String theme
    +Int cellSize
  }
  class Graph {
    +Node[] nodes
    +Edge[] edges
  }
  class Node {
    +String id
    +String label
    +String shape
  }
  DiagramRenderer --> TrellisConfig
  DiagramRenderer --> Graph
  Graph --> Node`,

  erDiagram: `erDiagram
  USER {
    int id PK
    string email
    string name
    timestamp created_at
  }
  PROJECT {
    int id PK
    string title
    string status
    int owner_id FK
  }
  DIAGRAM {
    int id PK
    string source
    string svg_output
    int project_id FK
    float quality_score
  }
  USER ||--o{ PROJECT : owns
  PROJECT ||--o{ DIAGRAM : contains`,
};

// ─── HEADER ──────────────────────────────────────────────────────────────────

function TrellisHeader({ isDark, toggleTheme }) {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 8);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <header style={{
      position: 'sticky', top: 0, zIndex: 100,
      background: scrolled ? 'var(--hs)' : 'transparent',
      backdropFilter: scrolled ? 'blur(12px)' : 'none',
      borderBottom: scrolled ? '1px solid rgba(74,138,181,0.2)' : '1px solid transparent',
      transition: 'all 200ms ease',
      padding: '0 32px',
    }}>
      <div style={{ maxWidth: 1280, margin: '0 auto', height: 58, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <a href="#" style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <img src="assets/trellis-logo-narrow.svg" height={26} alt="Trellis" style={{ filter: 'var(--logo-filter)' }} />
          <span style={{ fontFamily: 'var(--font-d)', fontWeight: 700, fontSize: 18, color: 'var(--tp)', letterSpacing: '-0.01em' }}>Trellis</span>
        </a>
        <nav style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
          {[
            { label: 'Editor', href: '#editor' },
            { label: 'Features', href: '#features' },
            { label: 'Docs', href: '#' },
          ].map(item => (
            <a key={item.label} href={item.href} style={{
              padding: '6px 13px', borderRadius: 6, fontSize: 13, fontWeight: 500,
              color: 'var(--ts)', transition: 'color 150ms, background 150ms',
            }}
            onMouseEnter={e => { e.currentTarget.style.color='var(--tp)'; e.currentTarget.style.background='var(--ac10)'; }}
            onMouseLeave={e => { e.currentTarget.style.color='var(--ts)'; e.currentTarget.style.background='transparent'; }}>
              {item.label}
            </a>
          ))}
          <a href="https://github.com/trellis-mermaid/trellis" target="_blank" rel="noopener"
            style={{
              display:'flex', alignItems:'center', gap: 6,
              padding: '6px 13px', borderRadius: 6, fontSize: 13, fontWeight: 500,
              color: 'var(--ts)', transition: 'color 150ms, background 150ms',
            }}
            onMouseEnter={e => { e.currentTarget.style.color='var(--tp)'; e.currentTarget.style.background='var(--ac10)'; }}
            onMouseLeave={e => { e.currentTarget.style.color='var(--ts)'; e.currentTarget.style.background='transparent'; }}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02.005 2.04.14 3 .4 2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg>
            GitHub
          </a>
          <button onClick={toggleTheme} title={isDark ? 'Switch to light mode' : 'Switch to dark mode'} style={{
            padding: '7px 10px', borderRadius: 6, background: 'transparent',
            border: '1px solid var(--ac25)', color: 'var(--tf)', cursor: 'pointer',
            transition: 'all 150ms', display: 'flex', alignItems: 'center', marginLeft: 4,
          }}
          onMouseEnter={e => { e.currentTarget.style.borderColor='var(--ac)'; e.currentTarget.style.color='var(--tp)'; }}
          onMouseLeave={e => { e.currentTarget.style.borderColor='var(--ac25)'; e.currentTarget.style.color='var(--tf)'; }}>
            {isDark
              ? <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
              : <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            }
          </button>
        </nav>
      </div>
    </header>
  );
}

// ─── EDITOR SECTION ──────────────────────────────────────────────────────────

function EditorSection({ isDark }) {
  const [diagramType, setDiagramType] = useState(() => localStorage.getItem('trellis-dtype') || 'flowchart');
  const [code, setCode] = useState(() => localStorage.getItem('trellis-code') || SAMPLE_DIAGRAMS.flowchart);

  // Default theme depends on color mode: ClassicBlueprint for dark, Default for light
  const defaultTheme = isDark ? 'classicblueprint' : 'default';
  const [theme, setTheme] = useState(() => localStorage.getItem('trellis-diagram-theme') || defaultTheme);

  const [error, setError] = useState(null);
  const [copied, setCopied] = useState(false);
  const [downloading, setDownloading] = useState(null);
  const [trellisReady, setTrellisReady] = useState(() => !!window.__trellis);
  const [trellisError, setTrellisError] = useState(null);
  const [metrics, setMetrics] = useState(null);
  const previewRef = useRef(null);
  const debounceRef = useRef(null);

  const layoutCols  = '1fr 1fr';
  const showGrid    = true;
  const showMetrics = true;

  // Switch default theme when color mode changes (only if using the default)
  useEffect(() => {
    const saved = localStorage.getItem('trellis-diagram-theme');
    if (!saved) {
      setTheme(isDark ? 'classicblueprint' : 'default');
    }
  }, [isDark]);

  // Await the WASM Promise — safe to call even after it has already resolved
  useEffect(() => {
    if (window.__trellis) { setTrellisReady(true); return; }
    const p = window.__trellisReady;
    if (!p) { setTrellisError('WASM module failed to start'); return; }
    p.then(() => {
      if (window.__trellis) setTrellisReady(true);
      else setTrellisError(window.__trellis_error || 'WASM init failed');
    });
  }, []);

  const renderDiagram = useCallback((src, thm) => {
    if (!previewRef.current || !window.__trellis) return;
    try {
      const configJson = JSON.stringify({ theme: thm });
      const resultJson = window.__trellis.render_with_metrics(src, configJson);
      const result = JSON.parse(resultJson);
      if (previewRef.current) {
        previewRef.current.innerHTML = result.svg;
        const svgEl = previewRef.current.querySelector('svg');
        if (svgEl) {
          svgEl.style.maxWidth = '100%';
          svgEl.style.height = 'auto';
          svgEl.style.display = 'block';
          svgEl.style.margin = '0 auto';
        }
        setMetrics(result.metrics);
        setError(null);
      }
    } catch (err) {
      if (previewRef.current) previewRef.current.innerHTML = '';
      setMetrics(null);
      setError(String(err).replace(/^Error:\s*/, ''));
    }
  }, []);

  useEffect(() => {
    if (!trellisReady) return;
    clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(() => renderDiagram(code, theme), 300);
    return () => clearTimeout(debounceRef.current);
  }, [code, theme, trellisReady, renderDiagram]);

  const switchType = (type) => {
    setDiagramType(type);
    const next = SAMPLE_DIAGRAMS[type];
    setCode(next);
    localStorage.setItem('trellis-dtype', type);
    localStorage.setItem('trellis-code', next);
  };

  const handleCode = (e) => {
    const val = e.target.value;
    setCode(val);
    localStorage.setItem('trellis-code', val);
  };

  const handleTheme = (e) => {
    const val = e.target.value;
    setTheme(val);
    localStorage.setItem('trellis-diagram-theme', val);
  };

  const copyCode = () => {
    navigator.clipboard.writeText(code).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    });
  };

  const downloadSVG = () => {
    const svg = previewRef.current?.querySelector('svg');
    if (!svg) return;
    setDownloading('svg');
    const blob = new Blob([svg.outerHTML], { type: 'image/svg+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'trellis-diagram.svg';
    a.click();
    setTimeout(() => setDownloading(null), 1000);
  };

  const downloadPNG = () => {
    const svg = previewRef.current?.querySelector('svg');
    if (!svg) return;
    setDownloading('png');
    try {
      const svgData = new XMLSerializer().serializeToString(svg);
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = () => {
        const scale = 2;
        const canvas = document.createElement('canvas');
        canvas.width  = (svg.viewBox.baseVal.width  || svg.clientWidth  || 800) * scale;
        canvas.height = (svg.viewBox.baseVal.height || svg.clientHeight || 600) * scale;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        const a = document.createElement('a');
        a.download = 'trellis-diagram.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
        setDownloading(null);
      };
      img.onerror = () => setDownloading(null);
      img.src = url;
    } catch {
      setDownloading(null);
    }
  };

  const btnStyle = (active) => ({
    fontFamily: 'var(--font-m)', fontSize: 11, padding: '4px 11px', borderRadius: 4,
    background: active ? 'rgba(74,138,181,0.2)' : 'transparent',
    border: '1px solid ' + (active ? 'var(--ac)' : 'var(--ac25)'),
    color: active ? 'var(--ac)' : 'var(--tm)',
    cursor: 'pointer', transition: 'all 150ms', whiteSpace: 'nowrap',
  });

  // Compute quality score from real metrics
  const qualityScore = metrics
    ? Math.max(0, 1 - (metrics.crossings || 0) * 0.05 - (metrics.deadlock_recoveries || 0) * 0.10).toFixed(2)
    : null;

  return (
    <section id="editor" style={{
      background: 'var(--pg)',
      backgroundImage: showGrid ? 'var(--grid)' : 'none',
      backgroundSize: '32px 32px',
      padding: '48px 0 0',
    }}>
      {/* Hero blurb */}
      <div style={{ textAlign: 'center', padding: '0 24px 28px' }}>
        <div style={{ display: 'inline-block', padding: '4px 14px', borderRadius: 999, border: '1px solid var(--ac35)', background: 'var(--ac10)', marginBottom: 18 }}>
          <span style={{ fontFamily: 'var(--font-m)', fontSize: 11, letterSpacing: '0.15em', textTransform: 'uppercase', color: 'var(--ac)' }}>Now in beta · v0.4.2</span>
        </div>
        <h1 style={{ fontFamily: 'var(--font-d)', fontSize: 'clamp(2rem,5vw,3.25rem)', fontWeight: 700, letterSpacing: '-0.02em', color: 'var(--tp)', lineHeight: 1.15 }}>
          Diagrams that <span style={{ color: 'var(--ac)' }}>actually route</span>.
        </h1>
        <p style={{ marginTop: 14, color: 'var(--ts)', fontSize: 15, maxWidth: 520, margin: '14px auto 0', lineHeight: 1.65 }}>
          Trellis renders clean, overlap-free Mermaid diagrams — automatically. Drop-in compatible with existing Mermaid syntax. Zero JavaScript required.
        </p>
      </div>

      {/* Diagram type tabs */}
      <div style={{ display: 'flex', justifyContent: 'center', gap: 6, padding: '0 24px 14px', maxWidth: 1280, margin: '0 auto', width: '100%' }}>
        {[['c4','C4 Context',false], ['flowchart','Flowchart',false], ['classDiagram','Class Diagram',true], ['erDiagram','ER Diagram',true]].map(([type, label, soon]) => (
          <div key={type} style={{ position: 'relative', display: 'inline-block' }}>
            <button disabled={soon} onClick={() => !soon && switchType(type)} style={{
              padding: '6px 18px', borderRadius: 6, fontSize: 12, fontWeight: 500, cursor: soon ? 'not-allowed' : 'pointer',
              border: '1px solid ' + (soon ? 'var(--ac12)' : diagramType === type ? 'var(--ac)' : 'var(--ac20)'),
              background: soon ? 'transparent' : diagramType === type ? 'var(--ac18)' : 'var(--sf3)',
              color: soon ? 'var(--tf)' : diagramType === type ? 'var(--tp)' : 'var(--tm)',
              transition: 'all 150ms', opacity: soon ? 0.6 : 1,
            }}>{label}</button>
            {soon && (
              <span style={{
                position: 'absolute', top: -8, right: -8,
                background: 'var(--ac)', color: '#fff',
                fontSize: 8, fontFamily: 'var(--font-m)', fontWeight: 700,
                letterSpacing: '0.08em', textTransform: 'uppercase',
                padding: '2px 6px', borderRadius: 999,
                pointerEvents: 'none', whiteSpace: 'nowrap',
              }}>Soon</span>
            )}
          </div>
        ))}
      </div>

      {/* Split pane */}
      <div style={{
        display: 'grid', gridTemplateColumns: layoutCols,
        gap: 1, background: 'var(--ac12)',
        margin: '0 auto', maxWidth: 1280, width: 'calc(100% - 48px)',
        borderRadius: 10, overflow: 'hidden',
        border: '1px solid rgba(74,138,181,0.2)',
        minHeight: 500,
      }}>
        {/* Code pane */}
        <div style={{ display: 'flex', flexDirection: 'column', background: 'var(--cb)', overflow: 'hidden' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '8px 14px', borderBottom: '1px solid var(--ac12)', gap: 8, flexWrap: 'wrap' }}>
            <span style={{ fontFamily: 'var(--font-m)', fontSize: 10, color: 'var(--tf)', textTransform: 'uppercase', letterSpacing: '0.12em' }}>Mermaid source</span>
            <button onClick={copyCode} style={btnStyle(copied)}>
              {copied ? '✓ Copied' : 'Copy'}
            </button>
          </div>
          <textarea
            value={code}
            onChange={handleCode}
            spellCheck={false}
            style={{
              flex: 1, background: 'transparent', border: 'none', outline: 'none', resize: 'none',

            Pre-built binaries for Linux, macOS, and Windows. WASM package for the browser. Docker image for CI pipelines.
          </p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {[
              { label: 'Download CLI binary', href: 'https://github.com/trellis-mermaid/trellis/releases', primary: true },
              { label: 'npm install trellis-wasm', href: 'https://github.com/trellis-mermaid/trellis', primary: false, mono: true },
              { label: 'docker pull ghcr.io/trellis-mermaid/trellis', href: '#', primary: false, mono: true },
              { label: 'VS Code — Install extension', href: 'https://marketplace.visualstudio.com/items?itemName=trellis-mermaid.trellis', primary: false, mono: false, icon: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg> },
              { label: 'IntelliJ — Install plugin', href: 'https://plugins.jetbrains.com/plugin/trellis-mermaid', primary: false, mono: false, icon: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 8h10M7 12h6M7 16h8"/></svg> },
            ].map((item, i) => (
              <a key={i} href={item.href} target="_blank" rel="noopener"
                style={{
                  display: 'flex', alignItems: 'center', gap: 8, padding: '10px 18px', borderRadius: 6,
                  fontFamily: item.mono ? 'var(--font-m)' : 'var(--font-b)',
                  fontSize: item.mono ? 12 : 14, fontWeight: item.primary ? 600 : 400,
                  background: item.primary ? 'var(--ac)' : 'var(--sf2)',
                  color: item.primary ? '#fff' : 'var(--ts)',
                  border: item.primary ? 'none' : '1px solid var(--ac25)',
                  cursor: 'pointer', transition: 'background 150ms, color 150ms',
                }}
                onMouseEnter={e => { e.currentTarget.style.background = item.primary ? 'var(--ac)' : 'var(--sf3)'; if (!item.primary) e.currentTarget.style.color='var(--tp)'; }}
                onMouseLeave={e => { e.currentTarget.style.background = item.primary ? 'var(--ac)' : 'var(--sf2)'; if (!item.primary) e.currentTarget.style.color='var(--ts)'; }}>
                {item.icon && <span style={{ flexShrink: 0, color: 'var(--ac)' }}>{item.icon}</span>}
                {item.label}
              </a>
            ))}
          </div>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <div style={{ background: 'var(--sf2)', border: '1px solid var(--ac20)', borderRadius: 10, overflow: 'hidden' }}>
            <div style={{ padding: '18px 22px', borderBottom: '1px solid var(--ac18)' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="rgba(74,138,181,0.8)"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02.005 2.04.14 3 .4 2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg>
                <span style={{ fontFamily: 'var(--font-m)', fontSize: 12, color: 'var(--tp)', fontWeight: 600 }}>trellis-mermaid/trellis</span>
              </div>
              <p style={{ fontSize: 12, color: 'var(--tm)', lineHeight: 1.6 }}>Open source · MIT OR Apache-2.0 · Rust</p>
            </div>
            {[
              { icon: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>, label: 'Report a bug', href: 'https://github.com/trellis-mermaid/trellis/issues/new?template=bug_report.md', desc: 'Found something broken? Open an issue.' },
              { icon: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>, label: 'Request a feature', href: 'https://github.com/trellis-mermaid/trellis/issues/new?template=feature_request.md', desc: 'Have an idea? We\'d love to hear it.' },
              { icon: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>, label: 'View all issues & discussions', href: 'https://github.com/trellis-mermaid/trellis/issues', desc: 'Browse open issues, discussions, and PRs.' },
            ].map((link, i, arr) => (
              <a key={i} href={link.href} target="_blank" rel="noopener"
                style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '14px 22px', borderBottom: i < arr.length - 1 ? '1px solid var(--ac12)' : 'none', transition: 'background 150ms', color: 'inherit', textDecoration: 'none' }}
                onMouseEnter={e => e.currentTarget.style.background='var(--ac10)'}
                onMouseLeave={e => e.currentTarget.style.background='transparent'}>
                <span style={{ color: 'var(--ac)', flexShrink: 0 }}>{link.icon}</span>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 500, color: 'var(--tp)' }}>{link.label}</div>
                  <div style={{ fontSize: 11, color: 'var(--tf)', marginTop: 1 }}>{link.desc}</div>
                </div>
                <svg style={{ marginLeft: 'auto', flexShrink: 0, color: 'rgba(74,138,181,0.5)' }} width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>
              </a>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

// ─── FOOTER ──────────────────────────────────────────────────────────────────

function TrellisFooter() {
  return (
    <footer style={{ background: 'var(--ft)', borderTop: '1px solid var(--ac12)', padding: '44px 32px' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto', display: 'grid', gridTemplateColumns: '1fr auto', alignItems: 'start', gap: 32, flexWrap: 'wrap' }}>
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
            <img src="assets/trellis-logo-narrow.svg" height={20} alt="Trellis" style={{ filter: 'var(--logo-filter)' }} />
            <span style={{ fontFamily: 'var(--font-d)', fontWeight: 700, fontSize: 15, color: 'var(--tp)' }}>Trellis</span>
          </div>
          <p style={{ fontSize: 12, color: 'var(--tf)', lineHeight: 1.7, maxWidth: 380 }}>
            A fast, overlap-free Mermaid-compatible diagram renderer built in Rust.
            Orthogonal edge routing. Zero JavaScript required.
          </p>
          <p style={{ marginTop: 16, fontSize: 11, color: 'var(--tff)', fontFamily: 'var(--font-m)' }}>
            © 2026 Trellis · MIT OR Apache-2.0 · <a href="https://trellislabs.net" style={{ color: 'var(--ac)' }}>trellislabs.net</a>
          </p>
        </div>
        <div style={{ display: 'flex', gap: 40 }}>
          {[
            { heading: 'Product', links: [['Editor','#editor'],['CLI','#'],['WASM','#'],['VS Code','#'],['IntelliJ','#']] },
            { heading: 'Resources', links: [['GitHub','https://github.com/trellis-mermaid/trellis'],['Docs','#'],['Releases','https://github.com/trellis-mermaid/trellis/releases'],['Issues','https://github.com/trellis-mermaid/trellis/issues']] },
          ].map(col => (
            <div key={col.heading}>
              <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.12em', color: 'var(--tff)', marginBottom: 12, fontFamily: 'var(--font-m)' }}>{col.heading}</div>
              {col.links.map(([l, href]) => (
                <div key={l} style={{ marginBottom: 8 }}>
                  <a href={href} target={href.startsWith('http') ? '_blank' : '_self'} rel="noopener"
                    style={{ fontSize: 12, color: 'var(--tm)', transition: 'color 150ms' }}
                    onMouseEnter={e => e.target.style.color='var(--tp)'}
                    onMouseLeave={e => e.target.style.color='var(--tm)'}>{l}</a>
                </div>
              ))}
            </div>
          ))}
        </div>
      </div>
    </footer>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────

function App() {
  const [isDark, setIsDark] = React.useState(() => {
    const saved = localStorage.getItem('trellis-theme-mode');
    return saved !== null ? saved === 'dark' : true;
  });

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    localStorage.setItem('trellis-theme-mode', isDark ? 'dark' : 'light');
  }, [isDark]);

  const toggleTheme = () => setIsDark(d => !d);

  return (
    <>
      <TrellisHeader isDark={isDark} toggleTheme={toggleTheme} />
      <EditorSection isDark={isDark} />
      <FeaturesSection />
      <HowItWorksSection />
      <UseCasesSection />
      <LatestReleaseSection />
      <GitHubSection />
      <TrellisFooter />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
