<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--prussian-blue); font-family: var(--font-body); padding: 20px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-tertiary); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; }
.badge-accent { background: var(--azure-10); border: 1px solid var(--azure-30); color: var(--cyanotype-azure); }
.badge-ok     { background: rgba(63,185,80,0.1); border: 1px solid rgba(63,185,80,0.3); color: #3fb950; }
.badge-warn   { background: rgba(210,153,34,0.1); border: 1px solid rgba(210,153,34,0.3); color: #d29922; }
.badge-error  { background: rgba(248,81,73,0.1); border: 1px solid rgba(248,81,73,0.3); color: #f85149; }
.badge-neutral{ background: rgba(232,244,251,0.08); border: 1px solid var(--border-default); color: var(--fg-secondary); }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--fg-secondary); }
.dot { width: 6px; height: 6px; border-radius: 50%; }
</style></head>
<body>
<div class="label">Status badges</div>
<div class="row">
  <span class="badge badge-accent">Coming Soon</span>
  <span class="badge badge-ok">✓ Rendered</span>
  <span class="badge badge-warn">⚠ Suboptimal</span>
  <span class="badge badge-error">✗ Failed</span>
  <span class="badge badge-neutral">MIT License</span>
</div>
<div class="label">Diagram type chips</div>
<div class="row">
  <span class="chip"><span class="dot" style="background:var(--cyanotype-azure)"></span>Flowchart</span>
  <span class="chip"><span class="dot" style="background:#c4b5fd"></span>Class</span>
  <span class="chip"><span class="dot" style="background:#86efac"></span>ER</span>
  <span class="chip"><span class="dot" style="background:#fbbf24"></span>C4</span>
</div>
<div class="label">Quality score indicators</div>
<div class="row">
  <span class="badge badge-ok">0.92 — Clean</span>
  <span class="badge badge-warn">0.67 — Suboptimal</span>
  <span class="badge badge-error">0.41 — Poor</span>
</div>
</body></html>
