<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--prussian-blue); font-family: var(--font-body); padding: 20px; }
.row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--border-subtle); }
.row:last-child { border-bottom: none; }
.meta { font-family: var(--font-mono); font-size: 9px; color: var(--fg-tertiary); min-width: 80px; flex-shrink: 0; }
.sample { color: var(--fg-primary); }
</style></head>
<body>
  <div class="row"><div class="meta">Display / 56px</div><div class="sample" style="font-family:'Courier Prime';font-size:2.5rem;font-weight:700;letter-spacing:-0.02em;line-height:1.1">Trellis</div></div>
  <div class="row"><div class="meta">H1 / 44px</div><div class="sample" style="font-family:'Courier Prime';font-size:2rem;font-weight:700;letter-spacing:-0.02em">Diagram Renderer</div></div>
  <div class="row"><div class="meta">H2 / 32px</div><div class="sample" style="font-family:'Courier Prime';font-size:1.75rem;font-weight:700">Overlap-free by construction</div></div>
  <div class="row"><div class="meta">H3 / 20px</div><div class="sample" style="font-family:'Inter';font-size:1.25rem;font-weight:700">A* pathfinding with rip-up-and-reroute</div></div>
  <div class="row"><div class="meta">Body / 15px</div><div class="sample" style="font-family:'Inter';font-size:0.9375rem;color:var(--fg-secondary)">A fast Mermaid diagram renderer built in Rust, using VLSI maze routing to produce orthogonal edge layouts.</div></div>
  <div class="row"><div class="meta">Label / 11px</div><div class="sample" style="font-family:'Inter';font-size:0.6875rem;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:var(--cyanotype-azure)">Coming Soon · MIT License</div></div>
</body></html>
