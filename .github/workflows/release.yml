name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Compute version from tag ────────────────────────────────────────────────
  versioning:
    name: Compute Version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gv.outputs.semVer }}
      major-minor-patch: ${{ steps.gv.outputs.majorMinorPatch }}
      pre-release-tag: ${{ steps.gv.outputs.preReleaseTag }}
      informational: ${{ steps.gv.outputs.informationalVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'
      - name: Compute version
        id: gv
        uses: gittools/actions/gitversion/execute@v3
      - name: Show version
        run: echo "Releasing ${{ steps.gv.outputs.semVer }}"

  # ── Run full test suite before releasing ────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  # ── Build CLI for all platforms ─────────────────────────────────────────────
  build-cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [test, versioning]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Stamp version in Cargo.toml
        shell: bash
        env:
          SEMVER: ${{ needs.versioning.outputs.semver }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' "s/^version = \"0\.0\.0\"/version = \"${SEMVER}\"/" Cargo.toml
          else
            sed -i "s/^version = \"0\.0\.0\"/version = \"${SEMVER}\"/" Cargo.toml
          fi

      - name: Build CLI
        shell: bash
        run: bash ./scripts/build-cli.sh --ci --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          SEMVER: ${{ needs.versioning.outputs.semver }}
        run: |
          cd dist/${{ matrix.target }}
          tar czf ../../trellis-${SEMVER}-${{ matrix.target }}.tar.gz trellis
          cd ../..

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        env:
          SEMVER: ${{ needs.versioning.outputs.semver }}
        run: |
          cd dist/${{ matrix.target }}
          7z a ../../trellis-${SEMVER}-${{ matrix.target }}.zip trellis.exe
          cd ../..

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        env:
          SEMVER: ${{ needs.versioning.outputs.semver }}
        with:
          name: release-cli-${{ matrix.target }}
          path: trellis-${{ needs.versioning.outputs.semver }}-${{ matrix.target }}.*

  # ── Build WASM + editor extensions ─────────────────────────────────────────
  build-editors:
    name: Editor Extensions
    runs-on: ubuntu-latest
    needs: [test, versioning]

    steps:
      - uses: actions/checkout@v4

      # ── WASM ──
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: bash ./scripts/build-wasm.sh --release

      # ── VS Code Extension ──
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Stamp VS Code extension version
        working-directory: editors/vscode
        env:
          SEMVER: ${{ needs.versioning.outputs.semver }}
        run: npm version "$SEMVER" --no-git-tag-version

      - name: Build VS Code extension
        working-directory: editors/vscode
        run: |
          npm install
          npm run compile
          npm run package

      - name: Upload .vsix
        uses: actions/upload-artifact@v4
        with:
          name: release-vscode
          path: editors/vscode/*.vsix

      # ── IntelliJ Plugin ──
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build IntelliJ plugin
        working-directory: editors/intellij
        env:
          SEMVER: ${{ needs.versioning.outputs.semver }}
        run: bash ./gradlew buildPlugin -Pplugin.version="$SEMVER" -x buildSearchableOptions

      - name: Upload IntelliJ plugin
        uses: actions/upload-artifact@v4
        with:
          name: release-intellij
          path: editors/intellij/build/distributions/*.zip

  # ── Docker image ───────────────────────────────────────────────────────────
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [test, versioning]

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.pandoc
          push: true
          labels: |
            org.opencontainers.image.version=${{ needs.versioning.outputs.semver }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.versioning.outputs.semver }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ── Create GitHub Release ──────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-cli, build-editors, docker, versioning]

    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets/
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## Trellis ${{ needs.versioning.outputs.semver }}

            ### Installation

            **CLI (pre-built binary):**
            Download the archive for your platform, extract, and add `trellis` to your PATH.

            | Platform | Archive |
            |---|---|
            | Linux x86_64 | `trellis-${{ needs.versioning.outputs.semver }}-x86_64-unknown-linux-gnu.tar.gz` |
            | macOS x86_64 | `trellis-${{ needs.versioning.outputs.semver }}-x86_64-apple-darwin.tar.gz` |
            | macOS ARM | `trellis-${{ needs.versioning.outputs.semver }}-aarch64-apple-darwin.tar.gz` |
            | Windows x86_64 | `trellis-${{ needs.versioning.outputs.semver }}-x86_64-pc-windows-gnu.zip` |

            **VS Code:** Install the `.vsix` from this release via `code --install-extension <file>.vsix`.

            **IntelliJ:** Install the `.zip` via Settings → Plugins → Install from Disk.

            **Docker:**
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.versioning.outputs.semver }}
            ```
