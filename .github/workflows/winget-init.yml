name: winget Init (one-time)

# Run this once manually to generate the seed manifests for the first
# winget community submission. After the first PR merges into
# microsoft/winget-pkgs, the release workflow handles all future versions.
#
# Usage: Actions → "winget Init (one-time)" → Run workflow → enter version
# Output: printed to job log + uploaded as artifact "winget-manifests"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v prefix, e.g. 1.2.3)'
        required: true
        type: string

jobs:
  generate-manifests:
    name: Generate winget manifests
    runs-on: windows-latest

    steps:
      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Generate manifests
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $url = "https://github.com/trellis-lab/trellis/releases/download/v$($env:VERSION)/trellis-$($env:VERSION)-x86_64-pc-windows-gnu.zip|x64|portable"
          .\wingetcreate.exe new `
            --urls $url `
            --publisher "Trellis Lab" `
            --name "Trellis" `
            --id "TrellisLab.Trellis" `
            --version $env:VERSION `
            --out manifests

      - name: Print generated manifests
        shell: pwsh
        run: |
          Write-Host "========== GENERATED MANIFESTS =========="
          Get-ChildItem manifests -Recurse -File | ForEach-Object {
            Write-Host ""
            Write-Host "---------- $($_.Name) ----------"
            Get-Content $_.FullName
          }
          Write-Host ""
          Write-Host "========================================="

      - name: Upload manifests as artifact
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: manifests/
          retention-days: 30
