<!DOCTYPE html>
<!--
  editors/intellij/src/main/resources/html/preview.html

  JCEF preview page for the Trellis IntelliJ plugin.

  Unlike the VS Code webview (which loads WASM via ES-module import), this
  page is a plain HTML shell.  All rendering happens on the JVM side via
  Chicory + WasmBridge.  The JVM side pushes SVG / error strings into the
  page by calling:

      window.trellisSetSvg(svgString)   — display a rendered diagram
      window.trellisSetError(message)   — display an error

  Both functions are defined in the <script> block below.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trellis Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #1e1e2e;
      color: #cdd6f4;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Toolbar ─────────────────────────────────────────────────────────── */
    #toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      background: #181825;
      border-bottom: 1px solid #313244;
      min-height: 28px;
    }
    #toolbar-icon {
      width: 16px;
      height: 16px;
      opacity: 0.8;
    }
    #status {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.75;
      font-size: 11px;
    }
    #spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #45475a;
      border-top-color: #89b4fa;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error box ───────────────────────────────────────────────────────── */
    #error-box {
      display: none;
      margin: 12px;
      padding: 10px 14px;
      background: #312030;
      border: 1px solid #f38ba8;
      border-radius: 6px;
      color: #f38ba8;
      font-family: "JetBrains Mono", "Cascadia Code", monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      flex-shrink: 0;
    }

    /* ── Diagram area ────────────────────────────────────────────────────── */
    #diagram-container {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 16px;
    }
    #diagram-container svg {
      max-width: 100%;
      height: auto;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }

    /* ── Empty state ─────────────────────────────────────────────────────── */
    #empty-state {
      margin: auto;
      text-align: center;
      opacity: 0.4;
      user-select: none;
    }
    #empty-state p { margin-top: 8px; font-size: 12px; }
  </style>
</head>
<body>

  <!-- ── Toolbar ──────────────────────────────────────────────────────────── -->
  <div id="toolbar">
    <div id="spinner"></div>
    <span id="status">Ready – open a .mmd file and use "Open Trellis Preview".</span>
  </div>

  <!-- ── Error display ────────────────────────────────────────────────────── -->
  <pre id="error-box"></pre>

  <!-- ── Diagram container ────────────────────────────────────────────────── -->
  <div id="diagram-container">
    <div id="empty-state">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none"
           xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="6" width="36" height="36" rx="4"
              stroke="currentColor" stroke-width="2"/>
        <line x1="16" y1="16" x2="32" y2="16" stroke="currentColor" stroke-width="2"
              stroke-linecap="round"/>
        <line x1="16" y1="24" x2="32" y2="24" stroke="currentColor" stroke-width="2"
              stroke-linecap="round"/>
        <line x1="16" y1="32" x2="24" y2="32" stroke="currentColor" stroke-width="2"
              stroke-linecap="round"/>
      </svg>
      <p>No diagram rendered yet.</p>
    </div>
  </div>

  <script>
    // ── DOM references ───────────────────────────────────────────────────────
    const statusEl    = document.getElementById('status');
    const spinnerEl   = document.getElementById('spinner');
    const errorEl     = document.getElementById('error-box');
    const containerEl = document.getElementById('diagram-container');
    const emptyEl     = document.getElementById('empty-state');

    // ── Helpers ──────────────────────────────────────────────────────────────
    function setStatus(text) { statusEl.textContent = text; }
    function showSpinner()   { spinnerEl.style.display = 'block'; }
    function hideSpinner()   { spinnerEl.style.display = 'none'; }

    function clearError() {
      errorEl.style.display = 'none';
      errorEl.textContent = '';
    }
    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    // ── Public API called by WasmBridge (JVM → JS) ───────────────────────────

    /**
     * Display a rendered SVG string.
     * Called from PreviewPanel.kt via browser.executeJavaScript().
     */
    window.trellisSetSvg = function(svgString) {
      clearError();
      hideSpinner();
      emptyEl.style.display = 'none';

      // Remove previous SVG
      const prev = containerEl.querySelector('svg');
      if (prev) prev.remove();

      // Parse and append the new SVG
      const tmp = document.createElement('div');
      tmp.innerHTML = svgString;
      const svgEl = tmp.querySelector('svg');
      if (svgEl) {
        containerEl.appendChild(svgEl);
        setStatus('Rendered · ' + svgEl.getAttribute('width') + ' × ' + svgEl.getAttribute('height'));
      } else {
        setStatus('Rendered (no SVG element found)');
      }
    };

    /**
     * Display a render error.
     * Called from PreviewPanel.kt via browser.executeJavaScript().
     */
    window.trellisSetError = function(message) {
      hideSpinner();
      showError(message);
      setStatus('Render error');
    };

    /**
     * Show the loading spinner (called before the JVM starts rendering).
     */
    window.trellisSetLoading = function(source) {
      clearError();
      showSpinner();
      setStatus('Rendering\u2026');
    };
  </script>
</body>
</html>
